[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "members-reader"
version = "0.1.0"
description = "Read member records from CSV files into typed Python objects. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tod" }]
keywords = ["csv", "members", "parser"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
members-reader = "members_reader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/members_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
